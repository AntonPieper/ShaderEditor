name: Android

on:
  pull_request:
  push:
    branches: [master, "integration/**"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # A newer commit on a pull request makes the older run pointless. A push to a
  # branch must finish, or frequent merges would never publish an APK; runs
  # for the same branch then go one after another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Without the secret (forks, upstream) the build uses a throwaway debug
      # key. With it, every build has the same signature, so a newer APK
      # installs over an older one without losing data.
      - name: Use the shared debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          {
            echo "SIGNING_ARGS<<EOF"
            echo "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/debug.keystore"
            echo "-Pandroid.injected.signing.store.password=android"
            echo "-Pandroid.injected.signing.key.alias=androiddebugkey"
            echo "-Pandroid.injected.signing.key.password=android"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build, lint and test
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest $SIGNING_ARGS

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ShaderEditor-debug-${GITHUB_SHA::7}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ShaderEditor-debug
          path: ShaderEditor-debug-*.apk
          retention-days: 14

  # One rolling pre-release per branch, replaced on every push, so the newest
  # build can be downloaded on a phone without signing in.
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: ShaderEditor-debug

      - name: Replace the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="latest-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" ShaderEditor-debug-*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build of $GITHUB_REF_NAME" \
            --notes "Debug build of $GITHUB_SHA. Installs next to the release app as \"Debug\"."
